name: GTA Eventwoche

on:
  workflow_dispatch:

  schedule:
    # Mittwoch und Donnerstag, jede Stunde
    - cron: "0 * * * 3,4"

permissions:
  contents: write

jobs:
  eventwoche:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Chromium installieren
        run: playwright install --with-deps chromium

      - name: LS-Insider starten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Status speichern
        run: |
          git config user.name "LS-Insider Bot"
          git config user.email "ls-insider-bot@users.noreply.github.com"

          git add weekly_state.json

          if git diff --cached --quiet; then
            echo "ℹ️ Kein neuer Status gespeichert."
          else
            git commit -m "Update weekly event state"
            git push
          fi
