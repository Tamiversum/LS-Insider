name: Insider Neu

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Manuellen Testlauf ohne Veröffentlichung ausführen"
        required: false
        type: boolean
        default: false
      quick_test:
        description: "Nur den schnellen Offline-Test ausführen"
        required: false
        type: boolean
        default: false
      all_posts_test:
        description: "Alle Postformate offline testen"
        required: false
        type: boolean
        default: false
      discord_post_test:
        description: "Testposts tatsächlich an Discord senden"
        required: false
        type: boolean
        default: false
      gsv_preview:
        description: "Quellkanal-Beiträge als Vorschau abrufen, ohne zu posten"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 23 * * 3"
      timezone: "Europe/Vienna"
    - cron: "0 15-23 * * 4"
      timezone: "Europe/Vienna"
    - cron: "0 15 * * 5"
      timezone: "Europe/Vienna"
    - cron: "15 * * * *"
      timezone: "Europe/Vienna"

permissions:
  contents: write

concurrency:
  group: ls-insider-weekly-state
  cancel-in-progress: false

jobs:
  insider_neu:
    name: Insider Neu
    runs-on: ubuntu-24.04
    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bei Bedarf Chromium installieren
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          LS_INSIDER_QUICK_TEST: ${{ inputs.quick_test }}
          LS_INSIDER_ALL_POSTS_TEST: ${{ inputs.all_posts_test }}
          LS_INSIDER_DISCORD_POST_TEST: ${{ inputs.discord_post_test }}
          LS_INSIDER_GSV_PREVIEW: ${{ inputs.gsv_preview }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$GITHUB_EVENT_SCHEDULE" == "15 * * * *" ]]; then
            echo "Quellkanal-Lauf: Chromium wird nicht benötigt."
          elif [[ "$LS_INSIDER_QUICK_TEST" == "true" || "$LS_INSIDER_ALL_POSTS_TEST" == "true" || "$LS_INSIDER_DISCORD_POST_TEST" == "true" || "$LS_INSIDER_GSV_PREVIEW" == "true" ]]; then
            echo "Offline-Test oder Vorschau: Chromium wird nicht benötigt."
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Insider Neu ausführen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GSV_WEEKLY_CHANNEL_ID: "1553860289102090381"
          LS_INSIDER_MIRROR_POLL: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.gsv_preview) }}
          LS_INSIDER_GSV_PREVIEW: ${{ inputs.gsv_preview }}
          LS_INSIDER_TEST_MODE: ${{ inputs.test_mode || inputs.gsv_preview }}
          LS_INSIDER_QUICK_TEST: ${{ inputs.quick_test }}
          LS_INSIDER_ALL_POSTS_TEST: ${{ inputs.all_posts_test }}
          LS_INSIDER_DISCORD_POST_TEST: ${{ inputs.discord_post_test }}
          LS_INSIDER_WEDNESDAY_SILENT: ${{ github.event_name == 'schedule' && github.event.schedule == '0 23 * * 3' }}
          LS_INSIDER_RUN_SELF_TEST: "false"
        run: python bot.py

      - name: Status speichern
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LS_INSIDER_TEST_MODE: ${{ inputs.test_mode || inputs.gsv_preview }}
          LS_INSIDER_QUICK_TEST: ${{ inputs.quick_test }}
          LS_INSIDER_ALL_POSTS_TEST: ${{ inputs.all_posts_test }}
          LS_INSIDER_DISCORD_POST_TEST: ${{ inputs.discord_post_test }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$LS_INSIDER_TEST_MODE" != "true" && "$LS_INSIDER_QUICK_TEST" != "true" && "$LS_INSIDER_ALL_POSTS_TEST" != "true" && "$LS_INSIDER_DISCORD_POST_TEST" != "true" && -f weekly_state.json ]]; then
            git config user.name "LS-Insider Bot"
            git config user.email "ls-insider-bot@users.noreply.github.com"
            git add weekly_state.json
            if git diff --cached --quiet; then
              echo "Kein neuer Status gespeichert."
            else
              git commit -m "Update Insider Neu state"
              git push
            fi
          else
            echo "Für diesen Lauf ist keine Statusänderung zu speichern."
          fi
